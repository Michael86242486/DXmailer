openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ORACLEX MAIL ENGINE — Transactional Email Infrastructure API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: email
    description: Email send and log operations
  - name: smtp
    description: SMTP pool management
  - name: stats
    description: Delivery statistics
  - name: developers
    description: Developer account management
  - name: webhooks
    description: Webhook endpoint management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/email/send:
    post:
      operationId: sendEmail
      tags: [email]
      summary: Queue an email for delivery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/email/logs:
    get:
      operationId: listEmailLogs
      tags: [email]
      summary: List email delivery logs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sent, failed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEmailLogsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/email/logs/{id}:
    get:
      operationId: getEmailLog
      tags: [email]
      summary: Get a single email log
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLog"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/smtp/pool:
    get:
      operationId: getSmtpPool
      tags: [smtp]
      summary: Get SMTP pool node status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMTP pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpPoolResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get delivery statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/developers:
    post:
      operationId: createDeveloper
      tags: [developers]
      summary: Provision a new developer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperInput"
      responses:
        "201":
          description: Developer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/developers/me:
    get:
      operationId: getDeveloperMe
      tags: [developers]
      summary: Get current developer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Developer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDeveloperMe
      tags: [developers]
      summary: Update developer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperUpdate"
      responses:
        "200":
          description: Updated developer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDeveloperMe
      tags: [developers]
      summary: Delete developer account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/developers/rotate-key:
    post:
      operationId: rotateDeveloperKey
      tags: [developers]
      summary: Rotate the developer API key
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New key issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List registered webhooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebhooksResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Register a new webhook endpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook endpoint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/webhooks/{id}/test:
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Send a test event to a webhook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    EmailInput:
      type: object
      properties:
        to:
          type: string
        template:
          type: string
          enum: [verification, otp, password-reset, magic-link, security-alert, welcome-email]
        senderName:
          type: string
        data:
          type: object
          additionalProperties: true
      required: [to, template, senderName]

    SendEmailResponse:
      type: object
      properties:
        messageId:
          type: string
        status:
          type: string
          enum: [queued]
      required: [messageId, status]

    EmailLog:
      type: object
      properties:
        id:
          type: string
        developerId:
          type: string
        recipient:
          type: string
        templateUsed:
          type: string
        status:
          type: string
          enum: [queued, sent, failed]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, developerId, recipient, templateUsed, status, createdAt]

    ListEmailLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/EmailLog"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [logs, total, limit, offset]

    SmtpNode:
      type: object
      properties:
        id:
          type: integer
        gmailUsername:
          type: string
        dailySentCount:
          type: integer
        maxDailyLimit:
          type: integer
        lastUsedTimestamp:
          type: integer
        status:
          type: string
          enum: [active, locked, rate_limited]
      required: [id, gmailUsername, dailySentCount, maxDailyLimit, lastUsedTimestamp, status]

    SmtpPoolResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SmtpNode"
        activeCount:
          type: integer
        totalCapacityRemaining:
          type: integer
      required: [nodes, activeCount, totalCapacityRemaining]

    StatsResponse:
      type: object
      properties:
        total:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        queued:
          type: integer
        successRate:
          type: number
      required: [total, sent, failed, queued, successRate]

    Developer:
      type: object
      properties:
        id:
          type: string
        apiKey:
          type: string
        companyName:
          type: string
        rateLimitPerMin:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, apiKey, companyName, rateLimitPerMin, createdAt]

    DeveloperInput:
      type: object
      properties:
        companyName:
          type: string
        rateLimitPerMin:
          type: integer
      required: [companyName]

    DeveloperUpdate:
      type: object
      properties:
        companyName:
          type: string
        rateLimitPerMin:
          type: integer

    Webhook:
      type: object
      properties:
        id:
          type: string
        developerId:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secret:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, developerId, url, events, secret, active, createdAt]

    WebhookInput:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum: [email.sent, email.failed, email.queued]
      required: [url, events]

    ListWebhooksResponse:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
      required: [webhooks]

    WebhookTestResponse:
      type: object
      properties:
        dispatched:
          type: boolean
        message:
          type: string
      required: [dispatched, message]
